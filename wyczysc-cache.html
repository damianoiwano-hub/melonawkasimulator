<!doctype html><html lang="pl"><meta charset="utf-8"><title>Czyszczenie cache Melonawka</title><body style="font-family:Segoe UI;background:#111;color:white;padding:30px"><h1>Czyszczenie starego cache</h1><p id="s">Trwa...</p><script>(async()=>{try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k);document.getElementById('s').textContent='Gotowe. Zamknij tę kartę i uruchom run.bat z wersji V4.'}catch(e){document.getElementById('s').textContent='Błąd: '+e}})()</script></body></html>
